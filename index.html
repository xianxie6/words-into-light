<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#121311"><title>光感文字 · 沉浸展厅</title>
<link rel="preload" href="fonts/Tangerine-Regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="style.css?v=gallery-1">
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="光影空间；拖动或使用方向键改变展厅视角，点击开始书写"></canvas>
<div class="grain" aria-hidden="true"></div>
<header class="header"><a class="brand" href="./" aria-label="光感文字首页"><span class="brand-mark">✳</span><span>光感文字<small>WORDS INTO LIGHT</small></span></a><div class="mode-switch" role="group" aria-label="场景模式"><button id="gallery-mode" aria-pressed="true">沉浸展厅</button><button id="wall-mode" aria-pressed="false">光感文字</button></div></header>
<main>
<section class="actions" aria-label="场景操作"><button id="write" class="primary"><svg viewBox="0 0 24 24"><path d="m14 5 5 5M4 20l4-1L20 7a2.8 2.8 0 0 0-4-4L4 15z"/></svg>开始书写<span class="button-arrow">↗</span></button><button id="upload" class="secondary"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.3"/><path d="m3 17 5-5 4 4 4-6 5 7"/></svg><span>上传照片</span></button><input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp,image/avif,image/gif" hidden><button id="replay" class="secondary" aria-label="重新播放" title="重新播放"><svg viewBox="0 0 24 24"><path d="M4 11a8 8 0 1 1 2 7M4 4v7h7"/></svg><span>重新播放</span></button><button id="settings-toggle" class="secondary settings-button" aria-label="调节光线" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M9 4v6m6 4v6"/></svg><span>调节光线</span></button></section>
<aside id="settings" class="settings-panel" hidden><div class="panel-heading">让光靠近一点<button id="close-settings" class="icon-button" aria-label="关闭光线设置">×</button></div><label for="intensity">光的强度 <output id="intensity-value">75%</output></label><input id="intensity" type="range" min="20" max="100" value="75"><label for="angle">光源位置 <output id="angle-value">居中</output></label><input id="angle" type="range" min="-100" max="100" value="0"><div class="temperature"><span>光的颜色</span><button class="swatch active" data-color="warm" aria-label="暖白光" aria-pressed="true"></button><button class="swatch cool" data-color="cool" aria-label="冷白光" aria-pressed="false"></button></div><div id="gallery-settings"><label for="zoom">观看距离 <output id="zoom-value">原位</output></label><input id="zoom" type="range" min="-10" max="25" value="0"><label for="image-fit">照片适配</label><select id="image-fit"><option value="contain">完整显示</option><option value="cover" selected>填满立柱</option></select><div class="settings-links"><button id="reset-view">返回正面</button><button id="reset-photo">恢复梵高</button></div><p class="photo-note">照片只保存在当前浏览器</p></div></aside>
<section id="editor" class="editor-panel" hidden aria-label="书写文字"><div class="panel-heading">把此刻写进光里<button id="close-editor" class="icon-button" aria-label="关闭文字编辑">×</button></div><textarea id="text-input" maxlength="240" spellcheck="false" aria-label="墙面文字" placeholder="写下你想留住的那句话…"></textarea><div class="editor-bottom"><span>回车换行 · 最多 240 字</span><button id="project">逐字投映 <span>↗</span></button></div></section>
</main><div id="notice" role="status" hidden></div>
<script src="light-renderer.js?v=gallery-1"></script>
<script src="gallery-renderer.js?v=gallery-1"></script>
<script src="app.js?v=gallery-1"></script>
</body>
</html>
